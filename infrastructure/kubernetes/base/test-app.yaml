apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: opspilot
  labels:
    app: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: demo-api
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: opspilot
spec:
  selector:
    app: demo-api
  ports:
    - port: 80
      targetPort: 80
