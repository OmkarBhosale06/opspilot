global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: demo-telemetry
    metrics_path: /metrics
    static_configs:
      - targets: ["demo-telemetry:9101"]
        labels:
          cluster: kind-opspilot
