name: opspilot-obs

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: opspilot-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - demo-telemetry
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: opspilot-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  demo-telemetry:
    build: ./demo-telemetry
    container_name: opspilot-demo-telemetry
    environment:
      PORT: "9101"
      LOKI_URL: http://loki:3100
      SERVICE_NAME: checkout-api
    ports:
      - "9101:9101"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
